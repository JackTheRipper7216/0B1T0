[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "obito-llmsec"
version = "0.1.0"
description = "An orchestrated benchmark for injection testing and oracles"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "python-dotenv==1.2.2",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llmsec"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
